name: MISRA lint

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format

      - name: Build and install cppcheck 2.21.0 (pinned -- Ubuntu's apt package is
          older and mishandles '#' comments in --suppressions-list files)
        run: |
          git clone --depth 1 --recurse-submodules --branch 2.21.0 https://github.com/danmar/cppcheck.git /tmp/cppcheck-src
          cmake -S /tmp/cppcheck-src -B /tmp/cppcheck-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/cppcheck-build -j"$(nproc)"
          sudo cmake --install /tmp/cppcheck-build
          cppcheck --version

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Generate compile_flags.txt
        run: ./scripts/gen_compile_flags.sh

      - name: Install uv and pre-commit
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv tool install pre-commit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run pre-commit (format + MISRA lint)
        run: pre-commit run --all-files
