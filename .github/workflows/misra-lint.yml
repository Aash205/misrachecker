name: MISRA lint

on:
  pull_request:
  push:
    branches: [threadx-example-fixture]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy clang-format cmake ninja-build gcc-arm-none-eabi

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build (real compile_commands.json, not the compile_flags.txt fallback)
        run: |
          cmake --preset Debug
          cmake --build build/Debug
          ./scripts/gen_compile_commands.sh .

      - name: Install uv and pre-commit
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv tool install pre-commit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run pre-commit (format + MISRA lint)
        run: pre-commit run --all-files
