name: MISRA lint

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy clang-format

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - uses: pre-commit/action@v3.0.1
